name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check the tag is injected as the version
        run: |
          go build -ldflags "-X github.com/AaronSaikovski/entra-appreg/internal/cli.version=$GITHUB_REF_NAME" -o "$RUNNER_TEMP/entra-appreg" ./cmd/entra-appreg
          actual=$("$RUNNER_TEMP/entra-appreg" --version)
          if [[ "$actual" != "entra-appreg ${GITHUB_REF_NAME#v}" ]]; then
            echo "Expected 'entra-appreg ${GITHUB_REF_NAME#v}', got '$actual'" >&2
            exit 1
          fi

      - name: Quality gates
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
