name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check the tag is injected as the version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -ldflags "-X main.version=$tag_version -X main.commit=${GITHUB_SHA::7} -X main.date=$built" -o "$RUNNER_TEMP/entra-appreg" ./cmd/entra-appreg
          actual=$("$RUNNER_TEMP/entra-appreg" --version)
          expected="entra-appreg $tag_version (commit ${GITHUB_SHA::7}, built $built)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Expected '$expected', got '$actual'" >&2
            exit 1
          fi

      - name: Quality gates
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.18.3
          # One target at a time: each cold build compiles msgraph-sdk-go (several GB of RAM);
          # four in parallel exhausted the hosted runner's memory and it shut down mid-build.
          args: release --clean --parallelism 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
