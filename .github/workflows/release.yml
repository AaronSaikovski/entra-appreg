name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check the tag is injected as the version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -ldflags "-X main.version=$tag_version -X main.commit=${GITHUB_SHA::7} -X main.date=$built" -o "$RUNNER_TEMP/entra-appreg" ./cmd/entra-appreg
          actual=$("$RUNNER_TEMP/entra-appreg" --version)
          expected="entra-appreg $tag_version (commit ${GITHUB_SHA::7}, built $built)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Expected '$expected', got '$actual'" >&2
            exit 1
          fi

      - name: Quality gates
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
