version: 2

project_name: entra-appreg

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: entra-appreg
    main: ./cmd/entra-appreg
    binary: entra-appreg
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/AaronSaikovski/entra-appreg/internal/cli.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: entra-appreg
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}-{{ .Tag }}-checksums.txt"
  algorithm: sha256

release:
  prerelease: auto

changelog:
  use: github
