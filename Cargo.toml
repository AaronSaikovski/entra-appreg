[package]
name = "entra-appreg"
version = "1.0.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "time", "process"] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
azure_core = { version = "1", default-features = false }
azure_identity = { version = "1", default-features = false, features = [
    "tokio",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
url = "2"
anyhow = "1"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
parking_lot = "0.12"
