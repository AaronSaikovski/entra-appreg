# using - https://taskfile.dev/

version: "3"

#ENV VARS
env:
  TARGET: entra-appreg{{exeExt}}
  APPPATH: ./cmd/entra-appreg
  PROJECT_NAME: entra-appreg

vars:
  # Build metadata linked into package main (cmd/entra-appreg/main.go).
  # VERSION is the git tag without its leading "v" (e.g. 0.0.1, or 0.0.1-3-gabc1234-dirty between tags).
  # Only [A-Za-z0-9._+-] is accepted: git tag names may contain shell
  # metacharacters, and these values are templated into shell commands.
  GIT_DESCRIBE:
    sh: v=$(git describe --tags --always --dirty 2>/dev/null || echo dev); case "$v" in *[!A-Za-z0-9._+-]*) echo invalid-version ;; *) echo "$v" ;; esac
  VERSION: '{{trimPrefix "v" .GIT_DESCRIBE}}'
  COMMIT:
    sh: c=$(git rev-parse --short HEAD 2>/dev/null || echo none); case "$c" in *[!0-9a-f]*) echo none ;; *) echo "$c" ;; esac
  DATE: '{{dateInZone "2006-01-02T15:04:05Z" now "UTC"}}'
  LDFLAGS: -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}}

###########################################################################

tasks:
  ## release - Builds the project in preparation for (local)release
  release:
    deps: [lint]
    cmds:
      - CGO_ENABLED=0 go build -trimpath -ldflags="-s -w {{.LDFLAGS}}" -o bin/{{.TARGET}} {{.APPPATH}}

  ###############################################################################

  ## goreleaser - Builds the project in preparation for release
  goreleaser:
    cmds:
      - goreleaser release --snapshot --clean

  ###############################################################################

  ## build - Builds the project in preparation for debug
  build:
    cmds:
      - go build  -o bin/{{.TARGET}} {{.APPPATH}}
      - #go build -ldflags="{{.LDFLAGS}}" -o bin/{{.TARGET}} {{.APPPATH}}

  ###############################################################################

  ## run - runs the CLI; pass arguments after --, e.g. `task run -- list --help`
  run:
    cmds:
      - go run -ldflags="{{.LDFLAGS}}" $APPPATH {{.CLI_ARGS}}

  ###############################################################################

  ## clean - Remove the old builds and any debug information
  clean:
    cmds:
      - go clean -cache
      - go clean
      - rm -rf dist bin
    platforms: [darwin, linux]
  clean_windows:
    silent: true
    cmds:
      - cmd /c "rmdir /s /q dist || exit 0"
      - cmd /c "rmdir /s /q bin || exit 0"
    platforms: [windows]

  ###############################################################################

  ## test - executes unit tests
  test:
    cmds:
      - go test -v ./...

  ###############################################################################

  ## check - CI quality gates plus an authentication-free binary smoke
  check:
    cmds:
      - test -z "$(gofmt -l .)"
      - go vet ./...
      - GOOS=windows go vet ./...
      - go build ./...
      - go test ./...
      - go build -ldflags="{{.LDFLAGS}}" -o bin/{{.TARGET}} {{.APPPATH}}
      - test "$(bin/{{.TARGET}} --version)" = "entra-appreg {{.VERSION}} (commit {{.COMMIT}}, built {{.DATE}})"
      - bin/{{.TARGET}} delete --help > /dev/null
      - "code=0; bin/{{.TARGET}} list --top 0 2>/dev/null || code=$?; test $code -eq 2"

  ###############################################################################

  ## deps - fetches any external dependencies and updates
  deps:
    cmds:
      - go mod tidy
      - go mod download
      - go get -u ./...

  ###############################################################################

  ## vet - Vet examines Go source code and reports suspicious constructs
  vet:
    cmds:
      - go vet ./...

  ###############################################################################

  ## staticcheck - Runs static code analyzer staticcheck
  staticcheck:
    cmds:
      - go run honnef.co/go/tools/cmd/staticcheck@v0.7.0-0.dev.0.20261009230814-452d5bb86b45 ./...

  ###############################################################################

  ## seccheck - Code vulnerability check
  seccheck:
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  ###############################################################################

  ## lint - format code and tidy modules
  lint:
    cmds:
      - go fmt ./...
      - go mod tidy -v
      - go fix ./...